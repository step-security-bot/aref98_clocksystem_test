name: Java CI with Gradle

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      DISPLAY: ":99.0"  # Set a display for Xvfb

    services:
      xvfb:
        image: selenium/standalone-chrome:latest
        options: -e VNC_SERVER=true -e VNC_PORT=5900

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Start Xvfb
      run: Xvfb $DISPLAY -ac -screen 0 1600x1200x24 > /dev/null 2>&1 &

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@417ae3ccd767c252f5661f1ace9f835f9654f2b5
      with:
        gradle-version: '8.5'

    - name: Build with Gradle 8.5
      run: gradle build

    - name: Publish Test Report
      uses: actions/upload-artifact@v6
      with:
        name: test-results
        path: app/build/reports/tests


  pmd-analysis:
    runs-on: ubuntu-latest
    permissions:
      contents: read       
      pull-requests: read   
    
    steps:
      - uses: actions/checkout@v4
      - uses: pmd/pmd-github-action@v2  # Change from v1 to v2
        with:
          rulesets: 'category/java/errorprone.xml'
          # uploadSarifReport: false

